<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente de Ruta</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #ff9800;
      --text: #ffffff;
      --text-dim: #b0b0b0;
      --btn-green: #2e7d32;
      --btn-blue: #1565c0;
      --btn-border: #333333;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 12px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--btn-border);
    }
    .header-tag {
      display: inline-block;
      background-color: var(--accent);
      color: #000;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .vehicle-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .plate {
      font-size: 1.1rem;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .field {
      margin-bottom: 12px;
    }
    .label {
      font-size: 0.8rem;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .value {
      font-size: 1.05rem;
      font-weight: 500;
    }
    .editable-input {
      width: 100%;
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      margin-top: 4px;
    }
    .editable-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 14px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: bold;
      text-decoration: none;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .btn-maps {
      background-color: var(--btn-green);
    }
    .btn-call {
      background-color: var(--btn-blue);
    }
    .btn-update {
      background-color: #424242;
      font-size: 0.9rem;
      padding: 8px;
    }
    .history-card {
      margin-top: 20px;
    }
    .history-item {
      padding: 10px 0;
      border-bottom: 1px solid #333;
      font-size: 0.9rem;
    }
    .history-item:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="header-tag" id="tag-exp">EXPEDIENTE</span>
    <div class="vehicle-title" id="val-vehiculo">Cargando...</div>
    <div class="plate" id="val-matricula">------</div>

    <div class="field">
      <div class="label">Asegurado / Conductor</div>
      <div class="value" id="val-asegurado">---</div>
    </div>

    <div class="field">
      <div class="label">Avería reportada</div>
      <div class="value" id="val-averia">---</div>
    </div>

    <div class="field">
      <div class="label">Recogida</div>
      <div class="value" id="val-recogida">---</div>
      <a id="btn-nav-rec" class="btn btn-maps" href="#" target="_blank" style="margin-top:8px;">📍 Navegar a Recogida</a>
    </div>

    <div class="field">
      <div class="label">Destino / Taller de Entrega</div>
      <input type="text" id="input-destino" class="editable-input" placeholder="Escribe el destino o taller...">
      <button type="button" id="btn-guardar-dest" class="btn btn-update" style="margin-top:6px;">Actualizar Ruta de Destino</button>
      <a id="btn-nav-ent" class="btn btn-maps" href="#" target="_blank" style="margin-top:8px;">🏁 Navegar a Destino</a>
    </div>

    <div class="field" id="box-obs" style="display:none;">
      <div class="label">Observaciones</div>
      <div class="value" id="val-obs">---</div>
    </div>

    <div class="btn-group">
      <a id="btn-tel" class="btn btn-call" href="#">📞 Llamar al Conductor</a>
    </div>
  </div>

  <div class="card history-card">
    <div class="label" style="margin-bottom:8px;">Historial Reciente (Local)</div>
    <div id="historial-list"></div>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var expediente = params.get('exp') || '';
      var matricula = params.get('mat') || '';
      var marca = params.get('marca') || '';
      var modelo = params.get('mod') || '';
      var recNom = params.get('rec_nom') || '';
      var recCoord = params.get('rec_coord') || '';
      var entNom = params.get('ent_nom') || '';
      var entCoord = params.get('ent_coord') || '';
      var asegurado = params.get('aseg') || '';
      var rawTel = params.get('tel') || '';
      var averia = params.get('averia') || '';
      var observaciones = params.get('obs') || '';

      // Limpieza del teléfono: quitar espacios, caracteres no numéricos y prefijo 34
      var cleanDigits = rawTel.replace(/\D/g, '');
      if (cleanDigits.startsWith('34') && cleanDigits.length === 11) {
        cleanDigits = cleanDigits.substring(2);
      }

      if (expediente) {
        document.getElementById('tag-exp').textContent = 'EXP: ' + expediente;
      }
      document.getElementById('val-vehiculo').textContent = (marca + ' ' + modelo).trim() || 'Vehículo';
      document.getElementById('val-matricula').textContent = matricula || '---';
      document.getElementById('val-asegurado').textContent = asegurado || '---';
      document.getElementById('val-averia').textContent = averia || '---';
      document.getElementById('val-recogida').textContent = recNom || 'Punto de recogida';
      document.getElementById('input-destino').value = entNom;

      if (observaciones) {
        document.getElementById('box-obs').style.display = 'block';
        document.getElementById('val-obs').textContent = observaciones;
      }

      var btnTel = document.getElementById('btn-tel');
      if (cleanDigits) {
        btnTel.href = 'tel:' + cleanDigits;
        btnTel.textContent = '📞 Llamar (' + cleanDigits + ')';
      } else {
        btnTel.style.display = 'none';
      }

      var btnNavRec = document.getElementById('btn-nav-rec');
      if (recCoord) {
        btnNavRec.href = '[https://www.google.com/maps/dir/?api=1&destination=](https://www.google.com/maps/dir/?api=1&destination=)' + encodeURIComponent(recCoord);
      } else if (recNom) {
        btnNavRec.href = '[https://www.google.com/maps/search/?api=1&query=](https://www.google.com/maps/search/?api=1&query=)' + encodeURIComponent(recNom);
      } else {
        btnNavRec.style.display = 'none';
      }

      var btnNavEnt = document.getElementById('btn-nav-ent');
      function actualizarEnlaceDestino(nombreDestino) {
        if (entCoord) {
          btnNavEnt.href = '[https://www.google.com/maps/dir/?api=1&destination=](https://www.google.com/maps/dir/?api=1&destination=)' + encodeURIComponent(entCoord);
          btnNavEnt.style.display = 'flex';
        } else if (nombreDestino && nombreDestino.trim() !== '') {
          btnNavEnt.href = '[https://www.google.com/maps/search/?api=1&query=](https://www.google.com/maps/search/?api=1&query=)' + encodeURIComponent(nombreDestino.trim());
          btnNavEnt.style.display = 'flex';
        } else {
          btnNavEnt.style.display = 'none';
        }
      }

      actualizarEnlaceDestino(entNom);

      document.getElementById('btn-guardar-dest').addEventListener('click', function() {
        var nuevoDestino = document.getElementById('input-destino').value;
        actualizarEnlaceDestino(nuevoDestino);
        guardarEnHistorial(nuevoDestino);
      });

      function guardarEnHistorial(destinoActual) {
        if (!matricula && !expediente) return;
        var historial = JSON.parse(localStorage.getItem('asistente_historial') || '[]');
        var registro = {
          exp: expediente,
          mat: matricula,
          vehiculo: (marca + ' ' + modelo).trim(),
          recogida: recNom,
          destino: destinoActual || entNom,
          fecha: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        historial = [registro].concat(historial.filter(function(item) {
          return item.exp !== expediente || !item.exp;
        })).slice(0, 5);
        localStorage.setItem('asistente_historial', JSON.stringify(historial));
        renderHistorial();
      }

      function renderHistorial() {
        var listContainer = document.getElementById('historial-list');
        var historial = JSON.parse(localStorage.getItem('asistente_historial') || '[]');
        if (historial.length === 0) {
          listContainer.innerHTML = '<span style="color:#666;">Sin registros previos</span>';
          return;
        }
        var html = '';
        for (var i = 0; i < historial.length; i++) {
          var item = historial[i];
          html += '<div class="history-item">' +
            '<strong>' + item.mat + '</strong> (' + item.vehiculo + ') - ' + item.fecha + '<br>' +
            '<span style="color:#aaa;">🏁 ' + (item.destino || 'Pendiente') + '</span>' +
            '</div>';
        }
        listContainer.innerHTML = html;
      }

      if (matricula || expediente) {
        guardarEnHistorial(entNom);
      } else {
        renderHistorial();
      }
    })();
  </script>
</body>
</html>

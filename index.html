<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistencia Grúa - Modo Cabina</title>
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-12 select-none">

  <!-- CABECERA DINÁMICA -->
  <header id="header-banner" class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-50 flex items-center justify-between transition-colors duration-500">
    <div class="flex items-center space-x-2">
      <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
      <span id="header-title" class="font-black tracking-wider text-sm uppercase text-slate-300">SERVICIO ACTIVO</span>
    </div>
    <div class="text-right">
      <span id="val-exp" class="text-lg text-slate-400 font-mono block">EXP. ---</span>
      <span id="val-poliza" class="text-xl font-black text-amber-500 font-mono block">PÓLIZA: ---</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- TARJETA VEHÍCULO Y AVERÍA -->
    <section class="bg-slate-900 border-2 border-slate-700 rounded-2xl p-4 shadow-xl">
      <div class="flex justify-between items-start">
        <div>
          <span id="val-cliente" class="text-xs font-bold text-amber-400 uppercase tracking-widest">CLIENTE/COMPAÑÍA</span>
          <h2 id="val-coche" class="text-xl font-black text-white mt-0.5">VEHÍCULO</h2>
        </div>
        <div id="val-matricula" class="bg-white text-black font-mono font-black text-lg px-3 py-1 rounded border-2 border-slate-400 shadow-inner tracking-wider">
          ---
        </div>
      </div>
      <div class="mt-3 pt-3 border-t border-slate-800 text-xs text-slate-400 flex flex-col space-y-1">
        <span>Avería / Tipo: <b id="val-averia" class="text-slate-200">Asistencia</b></span>
        <span class="text-rose-400 font-bold text-xs uppercase" id="val-notas"></span>
      </div>
    </section>

    <!-- CONTACTO CLIENTE -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-lg">
      <div class="flex justify-between items-baseline">
        <span class="text-xs font-semibold text-slate-400 uppercase">Contacto</span>
        <span id="val-contacto" class="text-base font-bold text-slate-200">Conductor</span>
      </div>
      <div class="grid grid-cols-2 gap-3 pt-1">
        <a id="btn-llamar" href="#" class="bg-emerald-600 active:bg-emerald-700 text-white font-bold py-3.5 px-3 rounded-xl flex items-center justify-center space-x-2 text-base shadow-md">
          <i class="fa-solid fa-phone text-lg"></i>
          <span>Llamar</span>
        </a>
        <a id="btn-whatsapp" href="#" target="_blank" class="bg-emerald-500 active:bg-emerald-600 text-slate-950 font-black py-3.5 px-3 rounded-xl flex items-center justify-center space-x-2 text-base shadow-md">
          <i class="fa-brands fa-whatsapp text-xl"></i>
          <span>Aviso 15 min</span>
        </a>
      </div>
    </section>

    <!-- NAVEGACIÓN 1: RECOGIDA -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2.5 shadow-lg">
      <div class="flex items-start space-x-3">
        <i class="fa-solid fa-location-arrow text-blue-500 text-lg mt-1"></i>
        <div>
          <span class="text-xs font-semibold text-slate-400 uppercase">Punto de Recogida</span>
          <p id="val-dir-rec" class="text-base font-bold text-slate-100">Dirección</p>
          <p id="val-pob-rec" class="text-xs text-slate-400">Población</p>
        </div>
      </div>
      <a id="btn-maps-rec" href="#" target="_blank" class="w-full bg-blue-600 active:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 text-sm shadow-md mt-2">
        <i class="fa-solid fa-map-location-dot"></i>
        <span>Ruta a Recogida</span>
      </a>
    </section>

    <!-- SECUENCIA DE CERROJOS Y ENTREGA -->
    <section class="bg-slate-900/90 border-2 border-dashed border-amber-500/50 rounded-2xl p-4 space-y-4">
      
      <!-- Paso 1: Foto Recogida -->
      <div class="text-center">
        <span class="inline-block bg-amber-500/10 text-amber-400 text-xs font-extrabold uppercase px-2.5 py-0.5 rounded-full border border-amber-500/30 mb-2">
          1. Cerrojo Recogida
        </span>
        <input type="file" id="input-cam-recogida" accept="image/*" capture="environment" class="hidden">
        <button id="btn-foto-recogida" type="button" class="w-full bg-slate-800 active:bg-slate-700 border border-slate-600 text-white font-bold py-3 rounded-xl flex items-center justify-center space-x-2">
          <i class="fa-solid fa-camera text-slate-300"></i>
          <span id="txt-btn-recogida">Foto coche cargado</span>
        </button>
      </div>

      <!-- Navegación 2: Entrega (Bloqueado al inicio) -->
      <div id="panel-ruta-entrega" class="opacity-40 transition-opacity duration-300 pointer-events-none border-t border-b border-slate-700 py-4 my-2">
        <div class="flex items-start space-x-3 mb-3">
          <i class="fa-solid fa-flag-checkered text-rose-500 text-lg mt-1"></i>
          <div>
            <span class="text-xs font-semibold text-slate-400 uppercase">Destino / Taller</span>
            <p id="val-dir-ent" class="text-base font-bold text-slate-100">Dirección</p>
            <p id="val-pob-ent" class="text-xs text-slate-400">Población</p>
          </div>
        </div>
        <a id="btn-maps-ent" href="#" target="_blank" class="w-full bg-blue-600 active:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 text-sm shadow-md">
          <i class="fa-solid fa-diamond-turn-right"></i>
          <span>Ruta a Destino</span>
        </a>
      </div>

      <!-- Paso 2: Foto Entrega (Bloqueado al inicio) -->
      <div id="panel-entrega" class="opacity-40 transition-opacity duration-300 pointer-events-none text-center">
        <span class="inline-block bg-rose-500/10 text-rose-400 text-xs font-extrabold uppercase px-2.5 py-0.5 rounded-full border border-rose-500/30 mb-2">
          2. Cerrojo Descarga
        </span>
        <input type="file" id="input-cam-entrega" accept="image/*" capture="environment" class="hidden">
        <button id="btn-foto-entrega" type="button" class="w-full bg-slate-800 active:bg-slate-700 border border-slate-600 text-white font-bold py-3 rounded-xl flex items-center justify-center space-x-2">
          <i class="fa-solid fa-camera text-slate-300"></i>
          <span id="txt-btn-entrega">Foto entrega taller</span>
        </button>
      </div>
    </section>

    <!-- FINALIZAR -->
    <button id="btn-finalizar" type="button" class="w-full bg-emerald-600/30 text-white/40 font-black text-lg py-4 rounded-2xl shadow-xl flex items-center justify-center space-x-2 uppercase tracking-wide cursor-not-allowed pointer-events-none transition-all duration-300">
      <i class="fa-solid fa-lock"></i>
      <span id="txt-btn-finalizar">Bloqueado</span>
    </button>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Carga de parámetros desde la URL
      const params = new URLSearchParams(window.location.search);
      if (params.toString() !== "") {
        if (params.get('exp')) document.getElementById('val-exp').innerText = 'EXP. ' + params.get('exp');
        if (params.get('poliza')) document.getElementById('val-poliza').innerText = 'PÓLIZA: ' + params.get('poliza');
        if (params.get('cliente')) document.getElementById('val-cliente').innerText = params.get('cliente');
        if (params.get('coche')) document.getElementById('val-coche').innerText = params.get('coche');
        if (params.get('matricula')) document.getElementById('val-matricula').innerText = params.get('matricula');
        if (params.get('averia')) document.getElementById('val-averia').innerText = params.get('averia');
        if (params.get('notas')) document.getElementById('val-notas').innerText = params.get('notas');
        if (params.get('contacto')) document.getElementById('val-contacto').innerText = params.get('contacto');
        
        const dirRec = params.get('dir_rec') || '---';
        const pobRec = params.get('pob_rec') || '';
        const dirEnt = params.get('dir_ent') || '---';
        const pobEnt = params.get('pob_ent') || '';

        document.getElementById('val-dir-rec').innerText = dirRec;
        document.getElementById('val-pob-rec').innerText = pobRec;
        document.getElementById('val-dir-ent').innerText = dirEnt;
        document.getElementById('val-pob-ent').innerText = pobEnt;

        // Llamadas y WhatsApp
        const pTel = params.get('tel');
        if (pTel) {
          document.getElementById('btn-llamar').href = 'tel:' + pTel;
          const waText = encodeURIComponent(`Hola ${params.get('contacto') || ''}, soy de la grúa. Llego a la dirección en unos minutos.`);
          document.getElementById('btn-whatsapp').href = `https://wa.me/34${pTel}?text=${waText}`;
        }

        // Navegación GPS / Dirección
        const coordsRec = params.get('coords_rec');
        const queryRec = coordsRec ? coordsRec : `${dirRec} ${pobRec}`;
        document.getElementById('btn-maps-rec').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(queryRec)}`;

        const coordsEnt = params.get('coords_ent');
        const queryEnt = coordsEnt ? coordsEnt : `${dirEnt} ${pobEnt}`;
        document.getElementById('btn-maps-ent').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(queryEnt)}`;
      }

      // 2. Control de Cerrojos y Cámara
      const btnRecogida = document.getElementById('btn-foto-recogida');
      const inputCamRecogida = document.getElementById('input-cam-recogida');
      const panelRutaEntrega = document.getElementById('panel-ruta-entrega');
      const panelEntrega = document.getElementById('panel-entrega');
      const btnEntrega = document.getElementById('btn-foto-entrega');
      const inputCamEntrega = document.getElementById('input-cam-entrega');
      const btnFinalizar = document.getElementById('btn-finalizar');

      function desbloquearRecogida() {
        const header = document.getElementById('header-banner');
        header.classList.remove('bg-slate-900', 'border-slate-800');
        header.classList.add('bg-rose-900', 'border-rose-700');

        const title = document.getElementById('header-title');
        title.innerText = "VEHÍCULO EN PLATAFORMA";
        title.classList.remove('text-slate-300');
        title.classList.add('text-white');

        document.getElementById('txt-btn-recogida').innerText = "Cargado ✓";
        btnRecogida.classList.remove('bg-slate-800', 'border-slate-600');
        btnRecogida.classList.add('bg-emerald-700', 'border-emerald-600');

        panelRutaEntrega.classList.remove('opacity-40', 'pointer-events-none');
        panelEntrega.classList.remove('opacity-40', 'pointer-events-none');
      }

      if (btnRecogida) {
        btnRecogida.addEventListener('click', () => {
          if (inputCamRecogida) inputCamRecogida.click();
          desbloquearRecogida();
        });
      }

      if (inputCamRecogida) {
        inputCamRecogida.addEventListener('change', desbloquearRecogida);
      }

      function desbloquearEntrega() {
        document.getElementById('txt-btn-entrega').innerText = "Descargado ✓";
        btnEntrega.classList.remove('bg-slate-800', 'border-slate-600');
        btnEntrega.classList.add('bg-emerald-700', 'border-emerald-600');

        const header = document.getElementById('header-banner');
        header.classList.remove('bg-rose-900', 'border-rose-700');
        header.classList.add('bg-emerald-900', 'border-emerald-800');
        document.getElementById('header-title').innerText = "ENTREGA REALIZADA";

        btnFinalizar.classList.remove('bg-emerald-600/30', 'text-white/40', 'cursor-not-allowed', 'pointer-events-none');
        btnFinalizar.classList.add('bg-emerald-600', 'text-white', 'cursor-pointer');
        document.getElementById('txt-btn-finalizar').innerText = "FINALIZAR SERVICIO";
        
        const iconLock = btnFinalizar.querySelector('i');
        if (iconLock) {
          iconLock.classList.remove('fa-lock');
          iconLock.classList.add('fa-check-double');
        }
      }

      if (btnEntrega) {
        btnEntrega.addEventListener('click', () => {
          if (inputCamEntrega) inputCamEntrega.click();
          desbloquearEntrega();
        });
      }

      if (inputCamEntrega) {
        inputCamEntrega.addEventListener('change', desbloquearEntrega);
      }

      // 3. Envío directo de datos a tu Google Sheet
      const SCRIPT_URL = https://script.google.com/macros/s/AKfycbxUURn-YFf_9Q_jezEFhcjXniveTWT-pcU8aUpKTzEnln4PKlfaEd2v-292wkJGzjrU/exec
      if (btnFinalizar) {
        btnFinalizar.addEventListener('click', () => {
          if (btnFinalizar.disabled || btnFinalizar.classList.contains('pointer-events-none')) return;

          // 1. Estado enviando: desactiva el botón y muestra animación
          btnFinalizar.disabled = true;
          btnFinalizar.classList.remove('bg-emerald-600', 'cursor-pointer');
          btnFinalizar.classList.add('bg-amber-600', 'cursor-not-allowed', 'opacity-90');
          btnFinalizar.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i><span>ENVIANDO A GOOGLE SHEETS...</span>';

          const ahora = new Date();
          const fechaHoraActual = ahora.toLocaleDateString('es-ES') + ' ' + ahora.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

          const datosServicio = {
            fechaHora: fechaHoraActual,
            expediente: document.getElementById('val-exp').innerText.replace('EXP. ', ''),
            poliza: document.getElementById('val-poliza').innerText.replace('PÓLIZA: ', ''),
            cliente: document.getElementById('val-cliente').innerText,
            vehiculo: document.getElementById('val-coche').innerText,
            matricula: document.getElementById('val-matricula').innerText,
            averia: document.getElementById('val-averia').innerText,
            notas: document.getElementById('val-notas').innerText,
            contacto: document.getElementById('val-contacto').innerText,
            telefono: document.getElementById('btn-llamar').href.replace('tel:', ''),
            recogida: document.getElementById('val-dir-rec').innerText + ' (' + document.getElementById('val-pob-rec').innerText + ')',
            entrega: document.getElementById('val-dir-ent').innerText + ' (' + document.getElementById('val-pob-ent').innerText + ')'
          };

          fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datosServicio)
          })
          .then(() => {
            // 2. Estado guardado: botón sellado en verde con confirmación visual
            btnFinalizar.classList.remove('bg-amber-600');
            btnFinalizar.classList.add('bg-slate-900', 'border-2', 'border-emerald-500', 'text-emerald-400');
            btnFinalizar.innerHTML = '<i class="fa-solid fa-check-double text-emerald-400 mr-2"></i><span>SERVICIO TERMINADO Y GUARDADO ✓</span>';
          })
          .catch((error) => {
            // 3. Si hay fallo de red o cobertura: permite reintentar sin perder los datos
            btnFinalizar.disabled = false;
            btnFinalizar.classList.remove('bg-amber-600', 'cursor-not-allowed', 'opacity-90');
            btnFinalizar.classList.add('bg-rose-600', 'cursor-pointer');
            btnFinalizar.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-2"></i><span>ERROR - TOCAR PARA REINTENTAR</span>';
          });
        });
      }
    });
  </script>
</body>
</html>

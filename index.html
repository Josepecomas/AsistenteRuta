<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistencia Grúa - Modo Cabina</title>
  
  <!-- Configuración PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2554/2554978.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen pb-12 select-none">

  <!-- CABECERA -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 sticky top-0 z-50 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
      <span class="font-black tracking-wider text-sm uppercase text-slate-300">SERVICIO ACTIVO</span>
    </div>
    <div class="text-right">
      <span id="val-exp" class="text-xs text-slate-400 font-mono">EXP. PENDIENTE</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- TARJETA VEHÍCULO -->
    <section class="bg-slate-900 border-2 border-slate-700 rounded-2xl p-4 shadow-xl">
      <div class="flex justify-between items-start">
        <div>
          <span id="val-cliente" class="text-xs font-bold text-amber-400 uppercase tracking-widest">CLIENTE/COMPAÑÍA</span>
          <h2 id="val-coche" class="text-xl font-black text-white mt-0.5">VEHÍCULO</h2>
        </div>
        <div id="val-matricula" class="bg-white text-black font-mono font-black text-lg px-3 py-1 rounded border-2 border-slate-400 shadow-inner tracking-wider">
          ---
        </div>
      </div>
      <div class="mt-3 pt-3 border-t border-slate-800 text-xs text-slate-400 flex items-center justify-between">
        <span>Avería / Tipo: <b id="val-averia" class="text-slate-200">Asistencia</b></span>
      </div>
    </section>

    <!-- ACCIONES RÁPIDAS -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-lg">
      <div class="flex justify-between items-baseline">
        <span class="text-xs font-semibold text-slate-400 uppercase">Contacto Destino</span>
        <span id="val-contacto" class="text-base font-bold text-slate-200">Conductor</span>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-1">
        <a id="btn-llamar" href="#" class="bg-emerald-600 active:bg-emerald-700 text-white font-bold py-3.5 px-3 rounded-xl flex items-center justify-center space-x-2 text-base shadow-md">
          <i class="fa-solid fa-phone text-lg"></i>
          <span>Llamar</span>
        </a>

        <a id="btn-whatsapp" href="#" target="_blank" class="bg-emerald-500 active:bg-emerald-600 text-slate-950 font-black py-3.5 px-3 rounded-xl flex items-center justify-center space-x-2 text-base shadow-md">
          <i class="fa-brands fa-whatsapp text-xl"></i>
          <span>Aviso 15 min</span>
        </a>
      </div>
    </section>

    <!-- NAVEGACIÓN -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2.5 shadow-lg">
      <div class="flex items-start space-x-3">
        <i class="fa-solid fa-location-dot text-rose-500 text-lg mt-1"></i>
        <div>
          <span class="text-xs font-semibold text-slate-400 uppercase">Destino / Entrega</span>
          <p id="val-dir" class="text-base font-bold text-slate-100">Dirección</p>
          <p id="val-pob" class="text-xs text-slate-400">Población</p>
        </div>
      </div>

      <a id="btn-maps" href="#" target="_blank" class="w-full bg-blue-600 active:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 text-sm shadow-md mt-2">
        <i class="fa-solid fa-diamond-turn-right"></i>
        <span>Abrir en Google Maps</span>
      </a>
    </section>

    <!-- CERROJO -->
    <section class="bg-slate-900/90 border-2 border-dashed border-amber-500/50 rounded-2xl p-4 text-center space-y-2">
      <span class="inline-block bg-amber-500/10 text-amber-400 text-xs font-extrabold uppercase px-2.5 py-0.5 rounded-full border border-amber-500/30">
        Cerrojo Activo
      </span>
      <p class="text-xs text-slate-300">Foto de coche cargado y matrícula antes de cerrar</p>
      
      <button class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white font-bold py-3 rounded-xl flex items-center justify-center space-x-2">
        <i class="fa-solid fa-camera text-slate-300"></i>
        <span>Hacer foto de comprobación</span>
      </button>
    </section>

    <!-- FINALIZAR -->
    <button class="w-full bg-emerald-600 active:bg-emerald-700 text-white font-black text-lg py-4 rounded-2xl shadow-xl flex items-center justify-center space-x-2 uppercase tracking-wide">
      <i class="fa-solid fa-check-double"></i>
      <span>Finalizar Servicio</span>
    </button>

  </main>

  <script>
    // Registro del Service Worker para habilitar la descarga como App
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('PWA Service Worker registrado con éxito'))
        .catch((err) => console.error('Fallo en Service Worker:', err));
    }

    // Lógica para atrapar los parámetros de la URL y rellenar la aplicación
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      
      if (params.toString() !== "") {
        // Extraer los datos (con valores por defecto por si falla algo)
        const pExp = params.get('exp') || '';
        const pCliente = params.get('cliente') || '';
        const pCoche = params.get('coche') || '';
        const pMatricula = params.get('matricula') || 'S/N';
        const pAveria = params.get('averia') || '';
        const pContacto = params.get('contacto') || 'Cliente';
        const pTel = params.get('tel') || '';
        const pDir = params.get('dir') || '';
        const pPob = params.get('pob') || '';

        // Inyectar el texto en la pantalla
        if(pExp) document.getElementById('val-exp').innerText = 'EXP. ' + pExp;
        if(pCliente) document.getElementById('val-cliente').innerText = pCliente;
        if(pCoche) document.getElementById('val-coche').innerText = pCoche;
        document.getElementById('val-matricula').innerText = pMatricula;
        if(pAveria) document.getElementById('val-averia').innerText = pAveria;
        document.getElementById('val-contacto').innerText = pContacto;
        if(pDir) document.getElementById('val-dir').innerText = pDir;
        if(pPob) document.getElementById('val-pob').innerText = pPob;

        // Construir los enlaces de los botones de acción
        if(pTel) {
          document.getElementById('btn-llamar').href = 'tel:' + pTel;
          
          // Mensaje automático para WhatsApp
          const waText = encodeURIComponent(`Hola ${pContacto}, soy de la grúa. Llego a la dirección en aproximadamente 15 minutos. Un saludo.`);
          document.getElementById('btn-whatsapp').href = `https://wa.me/34${pTel}?text=${waText}`;
        }

        // Enlace de Google Maps
        const mapsQuery = encodeURIComponent(`${pDir} ${pPob}`);
        document.getElementById('btn-maps').href = `https://www.google.com/maps/search/?api=1&query=${mapsQuery}`;
      }
    });
  </script>
</body>
</html>
